name: link-validation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate external source URLs
        run: npm run check:links
